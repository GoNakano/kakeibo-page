<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>シンプルな家計簿アプリ</title>
    <link rel="stylesheet" href="style.css" />
    <script src="index.js" defer></script>
  </head>
  <body>
    <header>
      <h1>家計簿アプリ</h1>
      <h2>家計簿をつけて節約</h2>
      <p>収入と支出を記録して管理しましょう！</p>
    </header>

    <main>
      <section class="summary-panel" aria-labelledby="summary-heading">
        <h2 id="summary-heading">合計金額</h2>
        <p>現在の合計: <strong>0円</strong></p>
      </section>

      <section class="entry-panel" aria-labelledby="entry-heading">
        <h2 id="entry-heading">家計簿に登録</h2>
        <form action="#" method="post">
          <p>
            <label for="entry-date">日付</label><br />
            <input type="date" id="entry-date" name="entry-date" required />
          </p>

          <p>
            <label for="entry-item">品目</label><br />
            <input
              type="text"
              id="entry-item"
              name="entry-item"
              placeholder="例：食料品"
              required
            />
          </p>

          <fieldset>
            <legend>区分</legend>
            <label>
              <input type="radio" name="entry-type" value="expense" checked />
              支出
            </label>
            <label>
              <input type="radio" name="entry-type" value="income" />
              収入
            </label>
          </fieldset>

          <p>
            <label for="entry-amount">金額（円）</label><br />
            <input
              type="number"
              id="entry-amount"
              name="entry-amount"
              min="0"
              step="1"
              placeholder="例：1000"
              required
            />
          </p>

          <button type="submit">追加</button>
        </form>
      </section>

      <section class="list-panel" aria-labelledby="list-heading">
        <h2 id="list-heading">登録済みのデータ</h2>
        <table>
          <caption>
            家計簿の登録一覧
          </caption>
          <thead>
            <tr>
              <th scope="col">日付</th>
              <th scope="col">品目</th>
              <th scope="col">区分</th>
              <th scope="col">金額</th>
            </tr>
          </thead>
          <tbody>
            <tr>
              <td colspan="4">登録されたデータはありません。</td>
            </tr>
          </tbody>
        </table>
      </section>
    </main>
  </body>
</html>
